name: 'AVM Terraform Azure Destroy'

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm you want to destroy resources'
        required: true
        type: string
      target_resources:
        description: 'Optional: comma-separated resource/module addresses to destroy (e.g. module.storage_account,module.virtual_network). Leave blank to destroy everything.'
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  validate-input:
    name: 'Validate confirmation'
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]; then
            echo "❌ Confirmation phrase did not match. You must type 'destroy' exactly to proceed."
            exit 1
          fi
          echo "✅ Confirmation accepted."

      - name: Show destroy scope 1
        run: |
          if [ -n "${{ github.event.inputs.target_resources }}" ]; then
            echo "⚠️ Scoped destroy requested for the following resources:"
            echo "${{ github.event.inputs.target_resources }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//'
          else
            echo "⚠️ FULL destroy requested — ALL resources in state will be destroyed."
          fi
      - name: Show destroy scope 2
        run: |
          if [ -n "${{ github.event.inputs.target_resources }}" ]; then
            echo "⚠️ Scoped destroy requested for the following resources:"
            echo "${{ github.event.inputs.target_resources }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//'
          else
            echo "⚠️ FULL destroy requested — ALL resources in state will be destroyed."
          fi
  destroy-plan:
    name: 'Terraform Destroy Plan'
    needs: validate-input
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AVM

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        run: terraform init

      - name: Build target flags
        id: targets
        run: |
          RAW="${{ github.event.inputs.target_resources }}"
          FLAGS=""
          if [ -n "$RAW" ]; then
            IFS=',' read -ra ITEMS <<< "$RAW"
            for item in "${ITEMS[@]}"; do
              trimmed=$(echo "$item" | sed 's/^ *//;s/ *$//')
              FLAGS="$FLAGS -target=\"$trimmed\""
            done
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Terraform Destroy Plan
        run: |
          eval terraform plan -destroy ${{ steps.targets.outputs.flags }} -out=tfdestroyplan

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfdestroyplan
          path: AVM/tfdestroyplan
          retention-days: 5

  destroy-apply:
    name: 'Terraform Destroy Apply'
    needs: destroy-plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ./AVM

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        run: terraform init

      - name: Download destroy plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfdestroyplan
          path: AVM

      - name: Terraform Destroy Apply
        run: terraform apply -auto-approve tfdestroyplan
